[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constructor-resilience"
version = "0.1.3"
description = "Durable claims, resume packets, and interest-surface sharing"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Rivlet / constructor-resilience contributors" }]
keywords = [
  "coherence",
  "context-compression",
  "QUBO",
  "knowledge-graph",
  "interest-intersection",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "networkx>=3.0"]
mlx = ["mlx-lm>=0.22"]
dev = ["pytest>=7.0"]
all = ["matplotlib>=3.7", "networkx>=3.0", "mlx-lm>=0.22", "pytest>=7.0"]

[project.scripts]
coherence = "coherence_cache.cli:main"

[project.urls]
Homepage = "https://github.com/rivletio/constructor-resilience"
Documentation = "https://github.com/rivletio/constructor-resilience#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
